[package]
name = "backend"
version = "0.0.4"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["multipart"] }
axum-extra = { version = "0.12", features = ["cookie", "cookie-signed"] }
sea-orm = { version = "2.0.0-rc", features = ["sqlx-postgres", "runtime-tokio-rustls", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "fs"] }
migration = { path = "./migration" }
dotenvy = "0.15"
uuid = { version = "1.18", features = ["v4"] }
time = "0.3"
sha2 = "0.10"
lettre = "0.11.22"
minijinja = "2.22.0"
rand = "0.9.2"
validator = { version = "0.20", features = ["derive"] }
regex = "1.12.2"
redis = { version = "1.2.1", features = ["tokio-comp", "cache-aio"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# aws-sdk-s3 = "1.112.0"
# aws-config = { version = "1.1.7", features = ["behavior-version-latest"] }
jwt-simple = { version = "0.12.16", default-features = false, features = ["pure-rust"] }
futures = "0.3.32"
argon2 = "0.5.3"
envy = "0.4.2"
mimalloc = "0.1.52"
imagesize = { version = "0.15.0", default-features = false, features = ["jpeg", "png"] }

[lints.clippy]
single_match = "warn"
single_match_else = "warn"
needless_match = "warn"
needless_late_init = "warn"
redundant_pattern_matching = "warn"
redundant_pattern = "warn"
redundant_guards = "warn"
collapsible_match = "warn"
match_single_binding = "warn"
match_same_arms = "warn"
match_ref_pats = "warn"
match_bool = "warn"
needless_bool = "deny"
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
panic = "abort"
codegen-units = 1
lto = "fat"
opt-level = "z"
strip = true
