<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <title>Сброс пароля</title>
        <style>
            body {
                background-color: #ffffff;
                font-family:
                    -apple-system, BlinkMacSystemFont, "Segoe UI", "Roboto",
                    "Oxygen", "Ubuntu", "Cantarell", "Fira Sans", "Droid Sans",
                    "Helvetica Neue", sans-serif;
            }
            .container {
                padding-left: 12px;
                padding-right: 12px;
                margin: 0 auto;
            }
            h1 {
                color: #333;
                font-family:
                    -apple-system, BlinkMacSystemFont, "Segoe UI", "Roboto",
                    "Oxygen", "Ubuntu", "Cantarell", "Fira Sans", "Droid Sans",
                    "Helvetica Neue", sans-serif;
                font-size: 24px;
                font-weight: 600;
                text-align: center;
            }
            p {
                color: #ababab;
                font-family:
                    -apple-system, BlinkMacSystemFont, "Segoe UI", "Roboto",
                    "Oxygen", "Ubuntu", "Cantarell", "Fira Sans", "Droid Sans",
                    "Helvetica Neue", sans-serif;
                text-align: center;
                margin-top: 2rem;
                font-size: 14px;
                margin: 24px 0;
            }

            .logo-container {
                text-align: center;
            }

            .logo-container a {
                display: inline-block;
                margin: 1rem auto 0;
            }

            .button {
                text-align: center;
                margin-top: 2rem;
            }

            .button a {
                background-color: #4f7fff;
                border-radius: 10px;
                color: #fff;
                font-weight: 500;
                font-family:
                    -apple-system, BlinkMacSystemFont, "Segoe UI", "Roboto",
                    "Oxygen", "Ubuntu", "Cantarell", "Fira Sans", "Droid Sans",
                    "Helvetica Neue", sans-serif;
                font-size: 14px;
                padding: 10px 20px;
                display: inline-block;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <div class="logo-container">
                <a href="{{ frontend_url }}" target="_blank">
                    <img
                        src="{{ frontend_url }}/logo.png"
                        width="64"
                        height="64"
                        alt="Logo"
                    />
                </a>
            </div>
            <h1>Сброс пароля</h1>
            <p>
                Вы получили это письмо, потому что вы пытались сбросить пароль
                на сайте.
                <br />
                Если вы не пытались сбросить пароль, можете смело игнорировать
                это письмо.
            </p>
            <div class="button">
                <a
                    href="{{ frontend_url }}/change-password?resetToken={{ reset_token }}"
                >
                    Сброс пароля
                </a>
            </div>
        </div>
    </body>
</html>
